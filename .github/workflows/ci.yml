# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, contracts, security, packaging
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact test environment
        run: python -m pip install --disable-pip-version-check -e '.[test]'
      - name: Verify formatting
        run: ruff format --check src tests scripts
      - name: Lint
        run: ruff check src tests scripts
      - name: Type check
        run: python -m mypy src
      - name: Verify serialized contracts
        run: |
          python scripts/verify_contracts.py
          python scripts/verify_release_tag.py v1.0.0
      - name: Verify repository boundaries
        run: python scripts/verify_boundaries.py
      - name: Run unit, contract, conformance, packaging, and lifecycle tests
        run: >-
          pytest
          --cov=meridian_storage.streaming
          --cov-report=term-missing
          --cov-report=xml
      - name: Generate conformance evidence
        run: python scripts/generate_conformance_evidence.py --output build/conformance-report.json
      - name: Static security analysis
        run: bandit -c pyproject.toml -r src
      - name: Audit runtime dependency pins
        run: pip-audit --require-hashes -r requirements-audit.txt
      - name: Build wheel and source distribution
        env:
          SOURCE_DATE_EPOCH: "1787659200"
        run: python -m build
      - name: Inspect release artifacts
        run: python scripts/verify_artifacts.py dist/*
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-python-3.12
          path: |
            coverage.xml
            build/conformance-report.json
          if-no-files-found: error

  compatibility:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install released runtime pins
        run: python -m pip install --disable-pip-version-check . pytest==8.4.1
      - name: Run compatibility suite
        run: pytest
